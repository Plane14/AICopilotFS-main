<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/SCSS/common.css" />
    <link rel="stylesheet" href="AIPilotPanel.css" />

    <script type="text/javascript" src="/JS/coherent.js"></script>
    <script type="text/javascript" src="/JS/common.js"></script>
    <script type="text/javascript" src="/JS/dataStorage.js"></script>
    <script type="text/javascript" src="/JS/buttons.js"></script>
    <script type="text/javascript" src="/JS/Services/ToolBarPanels.js"></script>
    <script type="text/javascript" src="/Pages/VCockpit/Instruments/Shared/BaseInstrument.js"></script>

    <link rel="import" href="/templates/NewPushButton/NewPushButton.html" />
    <link rel="import" href="/templates/ToggleButton/toggleButton.html" />
    <link rel="import" href="/templates/tabMenu/tabMenu.html" />
    <link rel="import" href="/templates/ingameUi/ingameUi.html" />
    <link rel="import" href="/templates/ingameUiHeader/ingameUiHeader.html" />
    <link rel="import" href="/templates/NewListButton/NewListButton.html" />

    <script type="text/javascript" src="/JS/debug.js"></script>
    <script type="text/javascript" src="AIPilotPanel.js"></script>
</head>

<body class="border-box">
    <ingamepanel-ai-pilot>
        <ingame-ui id="AIPilotPanel" panel-id="PANEL_AI_PILOT" title="AI PILOT" class="ingameUiFrame panelInvisible" content-fit="true" min-width="160" min-height="90">

            <div class="aipilot-statusbar">
                <span class="aipilot-state" id="controlState">MANUAL</span>
                <span class="aipilot-conn"><span class="aipilot-dot" id="connDot"></span><span id="connText">Offline</span></span>
            </div>

            <div class="aipilot-phase">
                <div class="aipilot-phaseLabel">Flight Phase</div>
                <div class="aipilot-phaseValue" id="phaseText">Standby</div>
            </div>

            <div class="aipilot-checklist" id="checklistLine">Checklist: --</div>

            <div class="aipilot-checklist" id="pushbackLine">Pushback: --</div>

            <div class="aipilot-checklist" id="trafficLine">Traffic: --</div>

            <div class="aipilot-checklist" id="weatherLine">Weather: --</div>

            <div class="aipilot-checklist" id="limitsLine">Envelope: --</div>

            <div class="aipilot-checklist" id="navLine">Route: --</div>
            <div class="aipilot-checklist" id="automationLine">Automation: off</div>

            <div class="aipilot-telemetry">
                <div class="aipilot-tele"><div class="aipilot-teleLabel">Alt AGL</div><div class="aipilot-teleValue" id="altAgl">--</div></div>
                <div class="aipilot-tele"><div class="aipilot-teleLabel">Airspeed</div><div class="aipilot-teleValue" id="ias">--</div></div>
                <div class="aipilot-tele"><div class="aipilot-teleLabel">Heading</div><div class="aipilot-teleValue" id="hdg">--</div></div>
                <div class="aipilot-tele"><div class="aipilot-teleLabel">Vertical</div><div class="aipilot-teleValue" id="vs">--</div></div>
                <div class="aipilot-tele"><div class="aipilot-teleLabel">Weight</div><div class="aipilot-teleValue" id="weight">--</div></div>
                <div class="aipilot-tele"><div class="aipilot-teleLabel">AP</div><div class="aipilot-teleValue" id="apState">--</div></div>
            </div>

            <div class="aipilot-actions">
                <new-push-button id="btnToggle" class="big" title="DELEGATE TO AI"></new-push-button>
                <new-push-button id="btnStopAfter" class="small" title="STOP AFTER THIS FLIGHT"></new-push-button>
            </div>

            <div class="aipilot-route" id="routeLine">-- / --</div>
            <div class="aipilot-atc" id="atcLine">ATC: --</div>
            <div class="aipilot-log" id="atcLog"></div>

        </ingame-ui>
    </ingamepanel-ai-pilot>
</body>
</html>
